# Local MySQL for development. After `docker compose up -d`, set DATABASE_URL in `.env` to:
# mysql://root:churchdev@localhost:3306/church_management
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Must match the password in DATABASE_URL when using this compose file.
      MYSQL_ROOT_PASSWORD: churchdev
      MYSQL_DATABASE: church_management
    ports:
      - "3306:3306"
    volumes:
      - church_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  church_mysql_data:
